<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Diario de Recetas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">🍳 Diario de Recetas</a>
            <div class="d-flex">
                {% if user.is_authenticated %}
                <a class="btn btn-outline-light me-2" href="{% url 'crear_receta' %}">Nueva receta</a>
                <a class="btn btn-outline-light me-2" href="{% url 'perfil' %}">Mi perfil ({{ user.username }})</a>
                <a class="btn btn-outline-light" href="{% url 'logout' %}">Cerrar sesión</a>
                {% else %}
                <a class="btn btn-outline-light me-2" href="{% url 'login' %}">Iniciar sesión</a>
                <a class="btn btn-light" href="{% url 'registro' %}">Registrarse</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>

</html>
